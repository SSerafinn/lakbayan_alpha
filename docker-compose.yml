name: lakbayan

services:
  # Shared local backend. `docker compose up` starts only this.
  emulators:
    build: ./docker/firebase
    container_name: lakbayan-emulators
    ports:
      - "4000:4000"   # Emulator Suite UI  -> http://localhost:4000
      - "4400:4400"   # hub
      # 4500 (logging) is deliberately NOT published. Windows reserves blocks of
      # ports for Hyper-V, and 4500 lands inside one on at least one machine
      # here (`netsh interface ipv4 show excludedportrange protocol=tcp` listed
      # 4495-4594). Docker then fails the whole container with "bind: An attempt
      # was made to access a socket in a way forbidden by its access
      # permissions" — and because it aborts partway through publishing, the
      # container comes up *healthy* with most ports unmapped, which looks like
      # a network problem rather than a port conflict.
      #
      # Nothing needs it from the host: the emulator still binds 4500 inside the
      # container, and the Emulator UI on 4000 shows the logs. The ranges are
      # assigned dynamically and move on reboot, so if another port here starts
      # failing the same way, check that command before anything else.
      - "5001:5001"   # functions
      - "8080:8080"   # firestore
      - "9099:9099"   # auth
      - "9150:9150"   # firestore websocket
      - "9199:9199"   # storage
    volumes:
      # Rules and indexes are read-only: the emulator hot-reloads them on save,
      # so editing firestore.rules on Windows takes effect without a restart.
      - ./firebase.json:/app/firebase.json:ro
      - ./firestore.rules:/app/firestore.rules:ro
      - ./firestore.indexes.json:/app/firestore.indexes.json:ro
      - ./storage.rules:/app/storage.rules:ro
      # Auth users and Firestore documents survive a restart.
      - ./.emulator-data:/app/.emulator-data
      # Cloud Functions source. The container installs and builds it on start
      # (docker/firebase/start.sh); lib/ lands back on the host through this
      # mount, node_modules stays in the named volume below.
      - ./functions:/app/functions
      - functions-modules:/app/functions/node_modules
      - ./docker/firebase/start.sh:/app/start.sh:ro
    command: ["sh", "/app/start.sh"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # CI-parity toolchain. Not started by `up` — invoke per command:
  #   docker compose run --rm toolchain dart analyze
  #
  # NOTE: because this service sits behind a profile, a bare `docker compose
  # build` silently skips it. Build with `docker compose --profile tools build`.
  toolchain:
    build:
      # Context is the repo root, not docker/flutter — the Dockerfile needs to
      # COPY pubspec files, and the root .dockerignore keeps the context small.
      context: .
      dockerfile: docker/flutter/Dockerfile
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app
      # Linux build artifacts MUST NOT share a directory with the Windows host's.
      # A .dart_tool/package_config.json written on Windows contains Windows
      # paths; letting the container overwrite it breaks host builds and vice
      # versa. Named volumes keep the two toolchains completely separate.
      - dart-tool:/app/.dart_tool
      - build-out:/app/build
      - gradle-project:/app/android/.gradle
      - pub-cache:/root/.pub-cache
      - gradle-home:/root/.gradle
      # Anything you want on the Windows side (APKs) must be copied here.
      - ./artifacts:/app/artifacts
    environment:
      # Reachable hostname for the emulator suite from inside the compose network.
      FIREBASE_EMULATOR_HOST: emulators
    stdin_open: true
    tty: true

  # Tile pipeline. Not started by `up` — invoke per command:
  #   docker compose --profile tiles run --rm tiles npm run smoke
  #
  # Its own image because MapLibre Native is a compiled OpenGL renderer whose
  # prebuilt binaries target Ubuntu 24.04, and it does not run on the Windows
  # hosts. See docker/tiles/Dockerfile and D-11.
  tiles:
    build:
      # Root context: the Dockerfile copies scripts/lib as well, so the tile
      # maths is shared with scripts/extract-tiles.mjs rather than duplicated.
      context: .
      dockerfile: docker/tiles/Dockerfile
    profiles: ["tiles"]
    # A real init to reap the Xvfb the entrypoint backgrounds. Without one the
    # renderer's own child processes accumulate as zombies across a long run.
    init: true
    working_dir: /app/tools/tiles
    volumes:
      - ./tools/tiles:/app/tools/tiles
      - ./scripts/lib:/app/scripts/lib:ro
      # Packs land on the host here. Gitignored — they are regenerable and
      # several MB each.
      - ./tiles:/app/out
      # Linux node_modules must not collide with anything the host installed,
      # the same separation the toolchain image keeps for .dart_tool.
      - tiles-modules:/app/tools/tiles/node_modules

volumes:
  tiles-modules:
  functions-modules:
  dart-tool:
  build-out:
  gradle-project:
  pub-cache:
  gradle-home:
