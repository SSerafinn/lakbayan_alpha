name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle 8.14 / AGP do not support JDK 26 — pin to 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6   # keep in step with the team's local SDK
          cache: true

      - run: flutter pub get

      # Generated sources are gitignored, so this must run before analyze.
      - run: dart run build_runner build

      - run: flutter analyze

      # `flutter analyze` does NOT execute custom_lint plugins, so riverpod_lint
      # rules are inert without this step.
      - run: dart run custom_lint

      - run: flutter test

      # google-services.json is gitignored. Materialize it from a repo secret when
      # one is configured. The APK currently builds without it, so this is a no-op
      # today; once Phase 1 applies the Google Services Gradle plugin the build
      # will require it, and the failure below is the signal to set the secret:
      #   base64 -w0 android/app/google-services.json  ->  secrets.GOOGLE_SERVICES_JSON
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/app
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          else
            echo "::notice::No GOOGLE_SERVICES_JSON secret set; building without it."
          fi

      - run: flutter build apk --debug
