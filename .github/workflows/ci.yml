name: CI
on:
  # Only the long-lived branches on push. Feature branches are covered by the
  # pull_request trigger — without this scoping every commit on a branch with an
  # open PR would build twice.
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# A new push supersedes the previous run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Flutter app: static analysis, tests, and a debug APK.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Gradle 8.14 / AGP do not support JDK 26 — pin to 17.
      # The rules job below needs 21 for the Firestore emulator, which is why
      # these are separate jobs rather than separate steps.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2 # keep in step with the team's local SDK
          cache: true

      - run: flutter pub get

      # After pub get, before codegen.
      #
      # It ran first originally, on the reasoning that formatting needs neither
      # step — which is true, but the formatter still reads analysis_options.yaml,
      # and that file `include:`s package:flutter_lints. With no package
      # resolution yet it cannot follow the include, so every run printed a
      # screenful of "Failed to resolve package URI" warnings. Harmless, and
      # more than enough to bury a real message.
      #
      # Still ahead of build_runner, which is the genuinely slow step, so a
      # whitespace mistake fails in well under a minute rather than ten.
      #
      # Only tracked files. Generated sources (*.freezed.dart, *.g.dart) are
      # gitignored but do exist once build_runner has run, and they are its
      # output rather than ours to format.
      #
      # `dart analyze` does not check formatting, which is how a de-indented
      # line with trailing whitespace once passed CI untouched.
      - run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      # Generated sources are gitignored, so this must run before analyze.
      - run: dart run build_runner build

      # `dart analyze`, NOT `flutter analyze`. Both read the same
      # analysis_options.yaml, but only `dart analyze` reliably loads the
      # native analyzer plugin that riverpod_lint became in 3.1.4. On at least
      # one developer machine `flutter analyze` reports a clean tree while
      # `dart analyze` flags real violations of it — so the two commands
      # disagree, and the one that catches more is the one to run.
      - run: dart analyze

      - run: flutter test

      # android/app/google-services.json is committed for the dev project — the
      # com.google.gms.google-services Gradle plugin reads it at build time, so
      # this step would otherwise fail with "File google-services.json is
      # missing". See docs/DECISIONS.md D-08.
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # Admin CMS (cms/). Independent of the Flutter job — different toolchain,
  # different deploy target — but the same schema contract.
  cms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cms/package-lock.json

      - run: npm install

      # `build` regenerates tokens.css from design/tokens.json first, so a token
      # change that breaks the generator fails here rather than in someone's
      # browser.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      # scripts/ rides along in this job rather than getting its own.
      #
      # Branch protection requires exactly three checks by name — `app`, `cms`
      # and `rules` (see docs/REPO_SETTINGS.md). A fourth job would not be
      # required, so it could fail without blocking a merge, which is worse
      # than a slightly overloaded job name. Move it out if and when the
      # required-checks list is updated to match.
      #
      # `npm test` here is the JavaScript half of the slug contract; the
      # TypeScript half runs above. They assert the same fixture, and the
      # importer creates duplicate destinations if the two ever disagree.
      - run: npm install
        working-directory: scripts
      - run: npm run lint
        working-directory: scripts
      - run: npm run test
        working-directory: scripts

      # functions/ too, for the same reason. `npm test` compiles first, so a
      # type error fails here as well as a failing assertion.
      - run: npm install
        working-directory: functions
      - run: npm run lint
        working-directory: functions
      - run: npm run test
        working-directory: functions

  # firestore.rules and storage.rules are code and are reviewed like code.
  # They are evaluated by the emulator rather than by Dart, so they get their
  # own job.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # firebase-tools refuses to run the Firestore emulator below JDK 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm install -g firebase-tools@15.19.0

      - run: npm install
        working-directory: test_rules

      # emulators:exec starts the suite, runs the command, and tears it down,
      # failing the job if the command does.
      #
      # --only firestore,storage: firebase.json now declares functions/, and
      # without this flag the suite would also try to start the functions
      # emulator — which needs functions/lib built and would fail this job for
      # a reason that has nothing to do with the rules.
      - run: firebase emulators:exec --only firestore,storage --project demo-lakbayan "cd test_rules && npm test"
