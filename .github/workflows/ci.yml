name: CI
on:
  push:
  pull_request:

jobs:
  # Flutter app: static analysis, tests, and a debug APK.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle 8.14 / AGP do not support JDK 26 — pin to 17.
      # The rules job below needs 21 for the Firestore emulator, which is why
      # these are separate jobs rather than separate steps.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6 # keep in step with the team's local SDK
          cache: true

      - run: flutter pub get

      # Generated sources are gitignored, so this must run before analyze.
      - run: dart run build_runner build

      - run: flutter analyze

      # `flutter analyze` does NOT execute custom_lint plugins, so riverpod_lint
      # rules are inert without this step.
      - run: dart run custom_lint

      - run: flutter test

      # android/app/google-services.json is committed for the dev project — the
      # com.google.gms.google-services Gradle plugin reads it at build time, so
      # this step would otherwise fail with "File google-services.json is
      # missing". See docs/DECISIONS.md D-08.
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # firestore.rules is code and is reviewed like code. It is evaluated by the
  # emulator rather than by Dart, so it gets its own job.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # firebase-tools refuses to run the Firestore emulator below JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install -g firebase-tools@15.19.0

      - run: npm install
        working-directory: test_rules

      # emulators:exec starts the suite, runs the command, and tears it down,
      # failing the job if the command does.
      - run: firebase emulators:exec --project demo-lakbayan "cd test_rules && npm test"
