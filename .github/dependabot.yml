# Dependency updates for the three ecosystems in this monorepo.
#
# Monthly, not weekly: a three-person student team does not need a PR queue,
# and the point here is to notice a security advisory or a stale major before
# it becomes a migration — not to chase every patch.
#
# The Flutter app's own version pins are deliberate and documented (see
# docs/DECISIONS.md and the comments in pubspec.yaml — riverpod_annotation and
# riverpod_lint are capped by the Dart SDK, json_annotation by an analyzer
# conflict). Expect Dependabot to propose raising those and to fail CI; close
# those PRs rather than forcing them, until the SDK moves.
#
# Every ecosystem sets `target-branch: staging`. Without it Dependabot opens
# against the repository's default branch, and the first monthly run did
# exactly that: twelve PRs aimed at `main`, which only release PRs may target
# (see docs/REPO_SETTINGS.md). Merging them there would have put `main` ahead
# of `staging` twelve times over — the divergence this project has already
# lost commits to. This setting is the fix that does not depend on anyone
# remembering to retarget.
version: 2

updates:
  - package-ecosystem: pub
    directory: /
    target-branch: staging
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      # The FlutterFire packages share a native Firebase Android SDK, pulled in
      # transitively, so raising one moves the native floor for all of them.
      # Split into separate PRs they break each other: bumping firebase_storage
      # alone (#45) passed analyze and every test, then failed the APK build
      # compiling a *different* package —
      #
      #   firebase_auth-6.5.7/.../FlutterFirebaseAuthPlugin.java:140:
      #   error: cannot find symbol
      #
      # firebase_auth 6.6.1 built fine on its own (#44). Neither PR was wrong;
      # they simply had to land together.
      firebase:
        patterns:
          - firebase_*
          - cloud_firestore

  - package-ecosystem: npm
    directory: /cms
    target-branch: staging
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      # React, its types and the router move together; separate PRs for each
      # just create conflicts.
      react:
        patterns:
          - react
          - react-dom
          - react-router-dom
          - "@types/react*"

  - package-ecosystem: npm
    directory: /test_rules
    target-branch: staging
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      # `@firebase/rules-unit-testing` declares a peer dependency on a matching
      # major of `firebase`, so the two cannot move apart. Split into separate
      # PRs they each fail `npm install` with ERESOLVE and neither can merge —
      # which is precisely what happened with #22 and #23.
      firebase:
        patterns:
          - firebase
          - "@firebase/*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    groups:
      # One PR for the lot. Every action pin lives in the same ci.yml, so
      # separate PRs conflict with each other by construction: merging the
      # first leaves the rest needing a rebase before they can follow.
      actions:
        patterns:
          - "*"
