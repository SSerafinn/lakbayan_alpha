name: lakbayan
description: Self-guided tourism companion for the Province of Cagayan.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# NOTE: versions are starting constraints; run `flutter pub get` (or `flutter pub upgrade`)
# and adjust as needed. Confirm the open decisions in docs/DECISIONS.md first.
dependencies:
  flutter:
    sdk: flutter
  # state & navigation
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  # models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  # firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  cloud_functions: ^5.0.4
  firebase_analytics: ^11.2.1
  firebase_crashlytics: ^4.0.4
  google_sign_in: ^6.2.1
  # local cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # audio
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  flutter_tts: ^4.0.2
  # media
  cached_network_image: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_lints: ^4.0.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
