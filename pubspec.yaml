name: lakbayan
description: Self-guided tourism companion for the Province of Cagayan.
publish_to: "none"
# Bumped at each staging -> main promotion, alongside the tag README's
# Releases section describes. It has now drifted in both directions: v0.2.0-m1
# was tagged while this line still said 0.1.0+1, and then 0.3.0+2 was set here
# for a promotion that never happened — four more PRs landed under a version
# that had already been spent, including a whole design language. Bump it
# *with* the tag, never in anticipation of one.
version: 0.4.0+3

environment:
  # The floor the dependency set actually needs — riverpod_lint 3.1.9 and
  # freezed 4 both require Dart 3.13. Stating it here means a stale local SDK
  # fails `pub get` with "requires SDK version ^3.13.0" instead of a page of
  # resolver output. Dart 3.13.x ships in Flutter 3.47.x, which is the pinned
  # version everywhere else (README, ci.yml, docker/flutter/Dockerfile).
  sdk: ^3.13.0

dependencies:
  animated_text_kit: ^4.3.0
  animations: ^3.0.0
  audio_service: ^0.18.19
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.10.2
  cloud_functions: ^6.5.1
  connectivity_plus: ^7.3.1
  firebase_analytics: ^12.6.1
  firebase_auth: ^6.7.1
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.1
  firebase_storage: ^13.6.1
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  # Offline basemap tiles, read straight out of a PMTiles pack on disk — the
  # `/tiles/{townId}/` shape docs/DATA_MODEL.md reserves and
  # scripts/extract-tiles.mjs produces. Raster, per D-11.
  flutter_map_pmtiles: ^1.0.5
  flutter_riverpod: ">=3.0.0 <4.0.0"
  flutter_tts: ^4.2.5
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  google_sign_in: ^7.2.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.4.0
  json_annotation: ^4.12.0
  just_audio: ^0.10.6
  # ^0.9.1, not ^0.10.1, and this is load-bearing rather than laziness.
  #
  # Every offline tile package for flutter_map — flutter_map_pmtiles,
  # flutter_map_mbtiles, and the whole vector_map_tiles chain — depends on
  # latlong2 0.9.x. flutter_map itself accepts `>=0.9.1 <0.11.0` and does not
  # care, so a ^0.10.1 pin here is what locks every one of them out. That was
  # the single finding that decided D-11's renderer.
  #
  # Nothing in lib/ or test/ imports latlong2 directly; it arrives through
  # flutter_map. Raise it only alongside a tile package that wants 0.10.
  latlong2: ^0.9.1
  lottie: ^3.6.1
  motor: ^1.1.0
  # Declared rather than leant on transitively through path_provider:
  # features/offline joins Storage paths to device paths, and a direct import
  # of a package we do not list is one `pub upgrade` away from vanishing.
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  # Share on Place detail: the system share sheet, handed plain text (see
  # `placeShareText`). Text only — there is no public page or app-link
  # domain yet for a link back into the app to open.
  share_plus: ^13.3.1
  smooth_sheets: ^1.1.2
  toggle_switch: ^2.3.0
  # Two jobs, both of which hand off rather than embed: the `geo:` URI that
  # opens driving directions in the device's map app (D-11 — live traffic is
  # something no offline pack can provide), and the ODbL copyright link the
  # map's attribution owes OpenStreetMap.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  flutter_lints: ^6.0.0
  freezed: ^4.0.0
  hive_ce_generator: ^1.9.0
  json_serializable: ^6.9.0
  riverpod_generator: ">=4.0.0 <5.0.0"
  # Also listed under `plugins:` in analysis_options.yaml — that is what loads
  # it into the analyzer; this entry is what lets Dependabot see the version.
  # Keep the two in step.
  riverpod_lint: ^3.1.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # Listed on its own: an asset directory is not recursive, so the line
    # above does not reach in here. Photographs for the debug sample preview
    # only (`sampleDataProvider`), each credited in CREDITS.md beside them.
    # They ship in every build, because Flutter cannot leave an asset out by
    # build mode — about 1.7 MB that a release never shows. Drop this line
    # for the release build, or accept the weight.
    - assets/images/samples/

  # Bundled rather than fetched via google_fonts: offline-first is a hard
  # guardrail, and google_fonts downloads at first run by default.
  # Both are variable fonts: see the FontVariation note in app_typography.dart.
  fonts:
    # Every word a person reads in the UI: body, labels, controls (D-13).
    # Fontshare licence (FFL) ships beside it.
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi/Fonts/TTF/Satoshi-Variable.ttf
        - asset: assets/fonts/Satoshi/Fonts/TTF/Satoshi-VariableItalic.ttf
          style: italic
    # Headings: titles, place names, section heads (D-19). Fontshare
    # licence (FFL) ships beside it.
    - family: CabinetGrotesk
      fonts:
        - asset: assets/fonts/CabinetGrotesk/Fonts/TTF/CabinetGrotesk-Variable.ttf
    # The glyphs behind `AppIcons` (D-20): Phosphor's regular and fill
    # weights, MIT, licence beside them. Bundled as fonts rather than through
    # `phosphor_flutter`, whose icon class extends the now-final `IconData`
    # and no longer compiles.
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor/Phosphor-Fill.ttf
    # The LAKBAYAN wordmark and the landing greetings only. Static OTF, so
    # no `wght` axis to set.
    - family: Barabara
      fonts:
        - asset: assets/fonts/Barabara/Barabara.otf
