name: lakbayan
description: Self-guided tourism companion for the Province of Cagayan.
publish_to: "none"
version: 0.1.0+1

environment:
  # ^3.8.0, not the scaffold's >=3.4.0: json_serializable warns and degrades
  # its output below 3.8. The toolchain image ships Dart 3.11.4.
  sdk: ^3.8.0

dependencies:
  animated_text_kit: ^4.3.0
  animations: ^2.2.0
  audio_service: ^0.18.19
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.9.0
  cloud_functions: ^6.3.5
  connectivity_plus: ^7.3.1
  firebase_analytics: ^12.5.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.3.0
  firebase_storage: ^13.5.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_riverpod: ">=3.0.0 <4.0.0"
  flutter_tts: ^4.2.5
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  # Held at ^4.9.0: json_serializable + riverpod_lint's analyzer pins can't
  # co-resolve with 4.12.x on Dart 3.11.4. Raise once the SDK is upgraded.
  json_annotation: ^4.9.0
  just_audio: ^0.10.6
  latlong2: ^0.10.1
  lottie: ^3.3.2
  path_provider: ^2.1.6
  # Capped below 4.0.5, which requires Dart >=3.12 (this project is on 3.11.4).
  riverpod_annotation: ">=4.0.0 <4.0.5"
  smooth_sheets: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  custom_lint: ">=0.8.0 <0.9.0"
  flutter_lints: ^6.0.0
  freezed: ^3.0.0
  hive_ce_generator: ^1.9.0
  json_serializable: ^6.9.0
  riverpod_generator: ">=4.0.0 <5.0.0"
  # Capped below 3.1.6, which requires Dart >=3.12 (this project is on 3.11.4).
  riverpod_lint: ">=3.0.0 <3.1.6"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Bundled rather than fetched via google_fonts: offline-first is a hard
  # guardrail, and google_fonts downloads at first run by default.
  # Both are variable fonts — see the FontVariation note in app_typography.dart.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    # Display face, landing page only. Static OTF, so no `wght` axis to set.
    - family: Barabara
      fonts:
        - asset: assets/fonts/Barabara/Barabara.otf
