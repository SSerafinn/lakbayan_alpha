include: package:flutter_lints/flutter.yaml

# Native analyzer plugins (Dart 3.13+). riverpod_lint moved here from
# custom_lint in 3.1.4, so `flutter analyze` now runs its rules directly — there
# is no separate lint command any more. Keep the version in step with
# dev_dependencies in pubspec.yaml.
plugins:
  riverpod_lint: ^3.1.9

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Sibling apps and Node tooling in the monorepo — nothing Dart lives here,
    # and node_modules would slow every analyze run to a crawl.
    - "cms/**"
    - "test_rules/**"
    - "scripts/**"
    # Build output and platform shells — no Dart of ours lives in them either.
    - "build/**"
    - "android/**"
    - "web/**"

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
    avoid_print: true
    require_trailing_commas: true
